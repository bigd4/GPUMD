run:
  executable: ../../src/build/gpu-sampling
  base_model: GaNB4-2048.xyz
  run_template: run.in
  gas_model: GaN-CN-2048-CVONLY.pt
  gas_config: GAScfg.yaml
  overwrite_work_dir: false
  resume: true
  state_file: driver_state.json
  work_dir: FFS_recovery_smoke_runs
  cuda_visible_devices: 0
  extra_files:
    - nep.txt

md:
  timestep_fs: 1.0
  temperature_K: 1000
  resample_velocities: true
  cv_log_interval: 10

ffs:
  interfaces: [4.10, 4.20, 4.55]
  direction: 1
  cv_index: 0
  fail_interface: 3.90
  flux_max_steps: 50
  interface_max_steps: [120, 20]
  replicas_per_crossing: 1
  flux_min_crossings: 1
  flux_max_runs: 1
  min_trials_per_interface: 1
  max_trials_per_interface: 1
  min_successes_per_interface: 1
  max_successes_per_interface: 1
  keep_failed: false
  random_seed: 20260705

adaptive:
  enabled: false
  min_interval_width: 0.03
  max_refinements: 0
  strategy: midpoint

recovery:
  mode: previous_interface
  max_rounds_per_interface: 1
  refill_successes: 1
  refill_max_trials: 3
