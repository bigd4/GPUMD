run:
  executable: ../../../src/build/gpu-sampling
  base_model: model.xyz
  run_template: run.in
  gas_model: Alanine-psi-cvonly.pt
  gas_config: GAScfg.yaml
  overwrite_work_dir: true
  resume: false
  state_file: driver_state.json
  work_dir: FFS_alanine_psi_3_to_minus1_runs
  cuda_visible_devices: 0
  extra_files:
    - nep-new.txt

md:
  timestep_fs: 1.0
  temperature_K: 300
  resample_velocities: true
  cv_log_interval: 1

ffs:
  # Alanine psi CV in radians.  The intended path is decreasing: 3 -> -1.
  interfaces: [3.0, 2.5, 2.0, 1.5, 1.0, 0.5, 0.0, -0.5, -1.0]
  direction: -1
  cv_index: 0
  fail_interface: 3.15
  replicas_per_crossing: 1
  flux_max_steps: 500
  interface_max_steps: 1000
  flux_min_crossings: 1
  flux_max_runs: 4
  min_trials_per_interface: 1
  max_trials_per_interface: 8
  min_successes_per_interface: 1
  max_successes_per_interface: 1
  keep_failed: true
  random_seed: 20260701

adaptive:
  enabled: true
  min_interval_width: 0.125
  max_refinements: 6
  strategy: midpoint

recovery:
  mode: previous_interface
  max_rounds_per_interface: 1
  refill_successes: 1
  refill_max_trials: 8
