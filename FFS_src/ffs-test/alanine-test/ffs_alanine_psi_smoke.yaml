run:
  executable: ../../../src/build/gpu-sampling
  base_model: model.xyz
  run_template: run.in
  gas_model: Alanine-psi-cvonly.pt
  gas_config: GAScfg.yaml
  overwrite_work_dir: true
  resume: false
  state_file: driver_state.json
  work_dir: FFS_alanine_psi_smoke_runs
  cuda_visible_devices: 0
  extra_files:
    - nep-new.txt

md:
  timestep_fs: 1.0
  temperature_K: 300
  resample_velocities: true
  cv_log_interval: 1

ffs:
  interfaces: [2.80, 2.85]
  direction: 1
  cv_index: 0
  fail_interface: 2.70
  replicas_per_crossing: 1
  flux_max_steps: 120
  interface_max_steps: 120
  flux_min_crossings: 1
  flux_max_runs: 4
  min_trials_per_interface: 1
  max_trials_per_interface: 4
  min_successes_per_interface: 1
  max_successes_per_interface: 1
  keep_failed: true
  random_seed: 20260701

adaptive:
  enabled: false
  min_interval_width: 0.01
  max_refinements: 0
  strategy: midpoint

recovery:
  mode: stop
  max_rounds_per_interface: 0
  refill_successes: 1
  refill_max_trials: 4
